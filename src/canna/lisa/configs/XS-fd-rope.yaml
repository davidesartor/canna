# XS-fd with RoPE in frequency (user's proposal, 2026-10-14): each source token and each data token
# gets its position in bins (the source at its current f0, the token at its centre bin), and q, k
# are rotated by it in every attention, so the score of a source on a token depends on
# f0 - f_token: the signal at f0 +- delta is found wherever the source sits. Periods log-spaced
# from 2 bins to twice the window. Everything else is XS-fd: the fixed optimizer (F40), sources
# sorted by SNR, the reconstruction loss.
problem:
  n_sources: 4
  t_obs: 63115200.0
  sampling_step: 0.25
  response_points: 16
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  f0_range: [1.0e-4, 12.0e-3] # 16 response points truncate it to [1.0e-4, 1.3e-3]
  snr_range: [7.0, 1000.0]

network:
  hidden_dim: 512
  num_blocks: 8
  num_heads: 8
  rope: true
  patch: 16 # rfft bins per token: 4 tokens (F34: 2 bins gave 32)

batch_size: 256
learning_rate: 1.0e-3 # Muon
adam_learning_rate: 3.0e-4 # AdamW
# schedule-free with the fixes of SF-NorMuon and ScheduleFree+ (F37): decay on z (0.05 per
# unit lr), Muon momentum 0.8 and AdamW b1 0.9 inside, beta 0.9 -> 0.965 log-linearly,
# averaging weights t lr^2, x following z for the first 2 x warmup_steps
weight_decay: 0.05
muon_momentum: 0.8
adam_b1: 0.9
sf_beta: 0.9
sf_beta_end: 0.965
sf_r: 1.0
# ScheduleFree+'s 1 / EMA |g|_1 step weighting, and NorMuon's row normalisation (SF-NorMuon)
sf_l1_weighting: false # off: coupled to the decay it shrank the weights 3.6x (F40)
normuon: true
# the parameter-reconstruction loss, at a constant weight beside the flow loss
aux_weight: 0.1
warmup_steps: 24000 # 2% of the run
total_steps: 1200000
log_interval: 1000
# flow clock warp s = 1 - (1 - t)^3: more of training near the end of the path, where
# a loud source's posterior is resolved (see path_position in train.py)
time_power: 3.0
seed: 0
