# response_points autosizes to 32 from this f0 range (16 before the antenna-pattern sidebands); its top is the old 16-point truncation, to the ulp
problem:
  n_sources: 4
  t_obs: 63115200.0
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  f0_range: [1.0e-4, 1.2637070256260989e-3]
  snr_range: [7.0, 1000.0]

warmup_steps: 13000
total_steps: 650000

network:
  loss_weights: true
