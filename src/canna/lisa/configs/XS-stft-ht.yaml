# XS-stft (F50/F51: STFT tokens, no AdamW decay) with two changes (research log F53, the user's
# request of 2026-10-19):
# - the orientation inferred as sin iota and the circular-mode phases phi0 + 2 psi and
#   phi0 - 2 psi (LisaGB.polarisation: helicity, F49), which quotients out the psi/phi0
#   symmetries; the geometry is [-1, 1] x circle x circle;
# - the template residual of B-template (F46): the data minus the sources at the flow's current
#   point, as a second group of STFT tokens' features beside the data (train.with_residual).
problem:
  n_sources: 4
  t_obs: 63115200.0
  sampling_step: 0.25
  response_points: 16
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  f0_range: [1.0e-4, 12.0e-3] # 16 response points truncate it to [1.0e-4, 1.3e-3]
  snr_range: [7.0, 1000.0]
  polarisation: helicity # phi0 +- 2 psi (F49)

network:
  hidden_dim: 512
  num_blocks: 8
  num_heads: 8
  rope: true
  stft: true # STFT tokens (network.stft_tokens)
  templates: true # the residual against the sources at x_t, as more STFT features (F46)
  patch: 16 # rfft bins per token: 4 tokens (F34: 2 bins gave 32)

batch_size: 256
learning_rate: 1.0e-3 # Muon
adam_learning_rate: 3.0e-4 # AdamW
weight_decay: 0.05 # on Muon's matrices only:
decay_adamw: false
muon_momentum: 0.8
adam_b1: 0.9
sf_beta: 0.9
sf_beta_end: 0.965
sf_r: 1.0
sf_l1_weighting: false # off: coupled to the decay it shrank the weights 3.6x (F40)
normuon: true
aux_weight: 0.1
warmup_steps: 24000 # 2% of the run
total_steps: 1200000
log_interval: 1000
time_power: 3.0
seed: 0
