# XS with the frequency-domain recipe (research log F32): the whitened rfft window, real and
# imaginary parts of A, E and T stacked, every input scalar through a piecewise linear
# encoding; schedule-free Muon (lr 1e-3, RMS-matched) with AdamW (3e-4, b2 0.95) for the
# encodings and the head; no aux heads, no cooldown, no position features. Same problem,
# seed, batch, length and clock warp as R1 (XS-pos), so its scorecard compares one to one.
# About 1200 x ~40 s = 13 h on an A100, one slot.
problem:
  n_sources: 4
  t_obs: 63115200.0
  sampling_step: 0.25
  response_points: 16
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  f0_range: [1.0e-4, 12.0e-3] # 16 response points truncate it to [1.0e-4, 1.3e-3]
  snr_range: [7.0, 1000.0]

network:
  hidden_dim: 512
  num_blocks: 8
  num_heads: 8
  patch: 2 # rfft bins per token: 32 tokens, as the WDM networks had

batch_size: 256
learning_rate: 1.0e-3 # Muon
adam_learning_rate: 3.0e-4 # AdamW
weight_decay: 1.0e-6
warmup_steps: 24000 # 2% of the run
total_steps: 1200000
log_interval: 1000
# flow clock warp s = 1 - (1 - t)^3: more of training near the end of the path, where
# a loud source's posterior is resolved (see path_position in train.py)
time_power: 3.0
seed: 0
