# B with the frequency-domain recipe of XS-fd (research log F32), launched alongside it: the
# whole 0.1-12 mHz band, 4096-bin windows, 2048 tokens. Same length as B1 and B2, 200k
# steps, in 24 h links that resume from the checkpoint (which keeps the schedule-free state).
# About 87 h on an A100.
problem:
  n_sources: 4
  t_obs: 63115200.0
  sampling_step: 0.25
  # response_points autosizes to 1024 based on full f0 range
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  f0_range: [1.0e-4, 12.0e-3]
  snr_range: [7.0, 1000.0]

network:
  hidden_dim: 512
  num_blocks: 8
  num_heads: 8
  patch: 16 # rfft bins per token: 256 tokens, 9x faster per step than 2 bins (F34)

batch_size: 256
learning_rate: 1.0e-3 # Muon
adam_learning_rate: 3.0e-4 # AdamW
# schedule-free with the fixes of SF-NorMuon and ScheduleFree+ (F37): decay on z (0.05 per
# unit lr), Muon momentum 0.8 and AdamW b1 0.9 inside, beta 0.9 -> 0.965 log-linearly,
# averaging weights t lr^2, x following z for the first 2 x warmup_steps
weight_decay: 0.05
muon_momentum: 0.8
adam_b1: 0.9
sf_beta: 0.9
sf_beta_end: 0.965
sf_r: 1.0
# ScheduleFree+'s 1 / EMA |g|_1 step weighting, and NorMuon's row normalisation (SF-NorMuon)
sf_l1_weighting: false # off: coupled to the decay it shrank the weights 3.6x (F40)
normuon: true
# the parameter-reconstruction loss, at a constant weight beside the flow loss
aux_weight: 0.1
warmup_steps: 4000 # 2% of the run
total_steps: 200000
log_interval: 1000
# flow clock warp s = 1 - (1 - t)^3 (see path_position in train.py)
time_power: 3.0
seed: 0
