problem:
  n_sources: 4
  t_obs: 63115200.0  # 2 years
  sampling_step: 0.25
  # a galactic binary is compact in frequency and spread over the whole baseline, so
  # the conditioning image is almost all frequency: 2 is the fewest time rows the WDM
  # lattice allows (its time step is wdm_times//2 bins, and the transform rejects an
  # odd count). window_bins = wdm_freq_bands * wdm_times//2 counts complex rfft bins,
  # so the image is 2 x 4096 real pixels over 4096 complex ones -- the same 8192 real
  # numbers a 32 x 256 image carried, laid out as a spectrum instead of a spectrogram
  wdm_freq_bands: 4096
  wdm_times: 2
  patch_downsample: 2  # == 2**patch_stages below
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  f0_range: [1.0e-4, 12.0e-3]
  snr_range: [7.0, 1000.0]   # amplitude prior, as a matched-filter snr range

network:
  hidden_dim: 512
  num_blocks: 8
  num_heads: 8
  patch_stages: 1

batch_size: 256
learning_rate: 1.0e-4
weight_decay: 0.0
total_steps: 500000
log_interval: 1000
warmup_frac: 0.5
seed: 0
