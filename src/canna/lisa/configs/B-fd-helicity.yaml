# B-long's recipe (B-fd-rope-long, the best B model, F48) with three changes folded into one run
# (research log F49; no ablations, compute-limited):
# - the Fisher (Mahalanobis) flow loss of B-fisher (F46), clipped at 100;
# - no weight decay on the AdamW parameters (velocity head, encodings, positions): F48 traced
#   phi0 never being learned since F39 to the decay pulling the head's phi0 rows to zero;
# - the helicity parametrisation of the orientation (LisaGB.polarisation): sin iota and the two
#   circular-mode phases phi0 +- 2 psi, in which the psi/phi0 symmetries are quotiented out and
#   the face-on degeneracy is one flat circle instead of a helix.
# ~35 h: two chained lisa.sbatch links, then lisa-post.sbatch.
problem:
  n_sources: 4
  t_obs: 63115200.0
  sampling_step: 0.25
  # response_points autosizes to 1024 based on full f0 range
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  f0_range: [1.0e-4, 12.0e-3]
  snr_range: [7.0, 1000.0]
  polarisation: helicity

network:
  hidden_dim: 512
  num_blocks: 8
  num_heads: 8
  rope: true
  patch: 16 # rfft bins per token: 256 tokens, 9x faster per step than 2 bins (F34)

batch_size: 256
learning_rate: 1.0e-3 # Muon
adam_learning_rate: 3.0e-4 # AdamW
# schedule-free with the fixes of SF-NorMuon and ScheduleFree+ (F37): decay on z (0.05 per
# unit lr) for Muon's matrices only, Muon momentum 0.8 and AdamW b1 0.9 inside, beta 0.9 -> 0.965
# log-linearly, averaging weights t lr^2, x following z for the first 2 x warmup_steps
weight_decay: 0.05
decay_adamw: false
muon_momentum: 0.8
adam_b1: 0.9
sf_beta: 0.9
sf_beta_end: 0.965
sf_r: 1.0
# ScheduleFree+'s 1 / EMA |g|_1 step weighting, and NorMuon's row normalisation (SF-NorMuon)
sf_l1_weighting: false # off: coupled to the decay it shrank the weights 3.6x (F40)
normuon: true
# the parameter-reconstruction loss, at a constant weight beside the flow loss
aux_weight: 0.1
fisher_cap: 100.0 # the most a direction is weighted up
warmup_steps: 12000 # 2% of the run
total_steps: 600000
log_interval: 1000
# flow clock warp s = 1 - (1 - t)^3 (see path_position in train.py)
time_power: 3.0
seed: 0
