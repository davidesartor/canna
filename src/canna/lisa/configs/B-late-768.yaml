# B (the whole 0.1-12 mHz band in 4096-bin windows, 2048 tokens) with the recipe settled on
# XS (F15, F23): aux heads for the first 10% of the run, the warped flow clock, and a
# constant lr whose last 20% decays linearly to 0. 768 wide, 8 blocks.
# The length is provisional: 200k steps until the benchmark (research log §7) has measured
# B's cost per step, extrapolated at ~1.5-2 s, i.e. several chained 24 h slots. Change
# total_steps and cooldown_steps together.
problem:
  n_sources: 4
  t_obs: 63115200.0
  sampling_step: 0.25
  # response_points autosizes to 1024 based on full f0 range
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  f0_range: [1.0e-4, 12.0e-3]
  snr_range: [7.0, 1000.0]

network:
  hidden_dim: 768
  num_blocks: 8
  num_heads: 12
  patch_stages: 1

batch_size: 256
learning_rate: 1.0e-4
weight_decay: 0.0
total_steps: 200000
# the last 20% of the run decays the lr linearly to 0 (F23: halves the f0 floor)
cooldown_steps: 40000
log_interval: 1000
# aux heads for the first 10% of the run, then pure flow
warmup_frac: 0.1
# flow clock warp s = 1 - (1 - t)^3: more of training near the end of the path, where
# a loud source's posterior is resolved (see path_position in train.py)
time_power: 3.0
seed: 0
# checkpoints without the optimizer state, to leave room in the home quota; a resume
# then restarts the optimizer's moments, as C1 did without harm
save_opt_state: false
