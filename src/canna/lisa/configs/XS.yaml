# B with the response window cut from 1024 bins to 16. Everything else -- network,
# batch, schedule -- is identical, so the only variable is how much of a source's
# neighbourhood the model gets to see.
#
# 16 bins is below the MIN_RESPONSE_POINTS=256 the auto-sizing would pick, so the
# response's modulation FFT is critically sampled: total power is right, per-bin
# amplitudes carry ~10-25% aliasing. LisaGB warns about this at construction.
problem:
  n_sources: 4
  t_obs: 63115200.0  # 2 years
  sampling_step: 0.25
  # window_bins = wdm_freq_bands * wdm_times//2 = 64, comfortably over the 2*16 the
  # sliding guard needs; the image is 2 x 64 real pixels over 64 complex bins
  wdm_freq_bands: 64
  wdm_times: 2
  patch_downsample: 2  # == 2**patch_stages below
  response_points: 16
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  # a 16-bin window holds the heaviest chirp only out to 1.2637e-3 Hz; asking for more
  # would just be capped there, so the band is written out honestly instead
  f0_range: [1.0e-4, 1.2e-3]
  snr_range: [7.0, 1000.0]   # amplitude prior, as a matched-filter snr range

network:
  hidden_dim: 512
  num_blocks: 8
  num_heads: 8
  patch_stages: 1

batch_size: 256
learning_rate: 1.0e-4
weight_decay: 0.0
total_steps: 500000
log_interval: 1000
warmup_frac: 0.5
seed: 0
