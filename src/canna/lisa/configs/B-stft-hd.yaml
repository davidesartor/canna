# B-stft-h (F56: STFT tokens, helicity phases phi0 +- 2 psi, no AdamW decay, no template) with the
# Doppler-demodulated band (research log F57, the user's request of 2026-10-22): each source's token
# also gets the 16 bins of the data around its f0, Doppler-demodulated at its current sky
# (network.doppler_bands; Cornish & Larson 2002, gr-qc/0206017), so the network reads the sky
# correction against a reference. Targets the individually offset sky posteriors (F56: 6 of 7
# strongly offset B sources have a Doppler modulation index >= 1 rad).
problem:
  n_sources: 4
  t_obs: 63115200.0
  sampling_step: 0.25
  # response_points autosizes to 1024 based on full f0 range
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  f0_range: [1.0e-4, 12.0e-3]
  snr_range: [7.0, 1000.0]
  polarisation: helicity # phi0 +- 2 psi (F49)

network:
  hidden_dim: 512
  num_blocks: 8
  num_heads: 8
  rope: true
  stft: true # STFT tokens (network.stft_tokens)
  doppler: true # per-source Doppler-demodulated band (network.doppler_bands, F57)
  patch: 16 # rfft bins per token: 256 tokens, 9x faster per step than 2 bins (F34)

batch_size: 256
learning_rate: 1.0e-3 # Muon
adam_learning_rate: 3.0e-4 # AdamW
weight_decay: 0.05 # on Muon's matrices only:
decay_adamw: false
muon_momentum: 0.8
adam_b1: 0.9
sf_beta: 0.9
sf_beta_end: 0.965
sf_r: 1.0
sf_l1_weighting: false # off: coupled to the decay it shrank the weights 3.6x (F40)
normuon: true
aux_weight: 0.1
warmup_steps: 4000 # 2% of the run
total_steps: 200000
log_interval: 1000
time_power: 3.0
seed: 0
