problem:
  n_sources: 4
  t_obs: 63115200.0
  sampling_step: 0.25
  response_points: 64
  oms_noise: 15.0
  acceleration_noise: 3.0
  mass_range: [0.15, 1.4]
  f0_range: [1.0e-4, 12.0e-3] # 64 response points truncate it to [1.0e-4, 4.2e-3]
  snr_range: [7.0, 1000.0]

network:
  hidden_dim: 512
  num_blocks: 8
  num_heads: 8
  patch_stages: 1

batch_size: 256
learning_rate: 1.0e-4
weight_decay: 0.0
total_steps: 500000
log_interval: 1000
warmup_frac: 0.5
seed: 0
