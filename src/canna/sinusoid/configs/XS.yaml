problem:
  n_sources: 2
  t_obs: 10000.0
  sampling_step: 1.0
  noise_level: 1.0
  wdm_freq_bands: 256
  patch_downsample: 4
  amp_range: [0.01, 1.0]
  freq_range: [1.0e-2, 1.0e-1]

network:
  hidden_dim: 256
  num_blocks: 4
  num_heads: 4
  patch_stages: 2

batch_size: 128
learning_rate: 1.0e-3
weight_decay: 0.0
total_steps: 1000
log_interval: 100
warmup_frac: 0.5
seed: 0
