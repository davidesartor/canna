[project]
name = "canna"
version = "0.1.0"
description = "Conditional flow-matching neural posterior estimation for inverse problems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "equinox>=0.13.8",
    "flax>=0.12.8",
    "jax>=0.10.1",
    "jaxtyping>=0.3.2",
    "optax>=0.2.8",
    "wdm-transform>=0.5.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda]>=0.10.1"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
