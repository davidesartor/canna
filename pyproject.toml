[project]
name = "canna"
version = "0.1.0"
description = "Conditional flow-matching neural posterior estimation (LISA Galactic Binaries)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blackjax>=1.5",
    "corner>=2.2.3",
    "einops>=0.8.1",
    "equinox>=0.13.8",
    "flax>=0.12.7",
    "jax[cuda]>=0.10.1",
    "jaxgb>=0.2.1",
    "jaxtyping>=0.3.2",
    "jexplore>=0.0.2",
    "lisaorbits>=3.0.3",
    "optax>=0.2.8",
    "tqdm>=4.67.1",
    "wdm-transform>=0.4.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
